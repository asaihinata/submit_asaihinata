[build-system]
requires=['setuptools>=45','wheel']
build-backend='setuptools.build_meta'
[project]
name='submit_asaihinata'
version='0.0.0'
description='評価用'
authors=[{name='asaihinata'}]
readme='README.md'
requires-python='>=3.14.3'
[project.optional-dependencies]
dev=['pytest>=7.0','black>=26.5.1','flake8>=4.0',]
[tool.isort]
line_length=88
skip=['tests','demo']
skip_glob=['*/demo*.py','*/*demo.py','*/*demo*.py','*/_import.py']
multi_line_output=0
include_trailing_comma=false
force_single_line=false
combine_as_imports=true
force_sort_within_sections=true